# /etc/nginx/sites-available/huquqim.conf  (TLS qatorlarini certbot --nginx --redirect qo'shadi)
server {
    listen 80;
    listen [::]:80;
    server_name huquqim.zehnprotect.uz;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Bosh sahifa -> Mini App (dashboard qobig'i ochiq ko'rinmasin)
    location = / {
        return 301 /miniapp;
    }

    # Davlat dashboardi, gov API (simulyatsiya, reset, kontent) va API hujjatlari — basic auth
    location ~ ^/(dashboard|api/gov/|docs|redoc|openapi\.json) {
        auth_basic "Huquqim admin";
        auth_basic_user_file /etc/nginx/huquqim.htpasswd;
        proxy_pass http://127.0.0.1:18080;
    }

    # Ochiq: /miniapp, /assets, bot va Mini App ishlatadigan /api/*
    location / {
        proxy_pass http://127.0.0.1:18080;
    }
}
